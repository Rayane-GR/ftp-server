<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>الملف غير موجود — AppJet Share</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050b16" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"><span class="blob blob-a"></span></div>
    <div class="share-wrap">
      <div class="share-card">
        <div class="share-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 8v5m0 3h.01" stroke-linecap="round" />
          </svg>
        </div>
        <h1>الملف غير موجود أو انتهت صلاحية الرابط</h1>
        <p class="meta"><span>قد يكون الرابط انتهت مدته أو حُذف الملف من الخادم.</span></p>
        <div class="share-actions">
          <a class="btn btn-primary" href="/">رفع ملف جديد</a>
          <a class="btn btn-ghost" href="/download">تحميل التطبيق</a>
        </div>
      </div>
    </div>
  </body>
</html>
